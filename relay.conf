# Which uptermd relay this team's pairing sessions go through. Filled in
# once by whoever runs the relay, after deploying it (pairing-setup's
# deploy.sh prints the values at the end).

# Hostname or IP of the relay, and uptermd's SSH port on it.
RELAY_HOST=""
RELAY_PORT="2222"

# The relay's SSH server key: its identity, the way a passport is yours.
# Every host and participant pins it in known_hosts, so a machine that
# merely pretends to be the relay (DNS hijack, malicious wifi) is refused
# instead of trusted. Key type + base64 blob, e.g. "ssh-ed25519 AAAA...".
# Check it from a second network before committing it:
#   ssh-keyscan -p 2222 -t ed25519 <relay-host>
RELAY_SERVER_KEY=""
